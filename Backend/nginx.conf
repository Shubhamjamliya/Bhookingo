# Nginx configuration for serving images directly from VPS storage
# Place this inside your server block in /etc/nginx/sites-available/default

server {
    listen 80;
    server_name api.domain.com; # Replace with your backend API domain

    # Serve uploads directly from VPS local storage
    location /images/ {
        alias /var/storage/;
        
        # Security: Disable directory listing
        autoindex off;

        # Standard file headers & cache settings (30 days caching)
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # CORS permissions (allows frontend domain to fetch images if needed)
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        
        # Security: Block code execution in upload folders
        location ~* \.(php|pl|py|jsp|sh|cgi)$ {
            deny all;
        }
    }

    # Proxy to Node.js backend app
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
